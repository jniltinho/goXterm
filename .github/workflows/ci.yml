# Checks of the Go + Wails app; no binaries are published here (releases: release-go.yml on v* tags).
# Everything runs in Docker (the toolchain image built from build/linux.Dockerfile); the runner needs
# only Docker and make. The archived Rust app (archive/rust/) is not built or tested.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
# Cancel a superseded run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard scans the full history
      - name: Go checks (gofmt, go vet, unit tests, module layering, skin token parity)
        run: make check test layers
      - name: "Publication guard (CI mode, no base/)"
        run: make guard GUARD_ARGS=--ci
      - name: Frontend lint (Vite Plus)
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src/frontend node:24 sh -c 'npm ci --no-audit --no-fund && npx vp check --no-fmt'

  # Integration tests against the Docker lab (lab/README.md); the passing tests must equal
  # lab/expected-tests.txt.
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: lab/lab.sh up
      - run: make embed-stub lab-test
      - name: Lab logs on failure
        if: failure()
        run: docker compose -f lab/compose.yaml logs --no-color | tail -n 300
      - name: Lab down
        if: always()
        run: lab/lab.sh down

  # Every release target still builds (Linux CGO, Windows WebView2, macOS purego + universal app).
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make build windows macos
