# Builds and publishes the Go + Wails app on version tags (v0.9.0, v0.9.1-rc.1) — the
# only release; the Rust release (release.yml) is disabled:
# the Linux binary and AppImage, the Windows .exe and the universal macOS app (zip), all built in
# Docker by `make dist-all`, plus SHA256SUMS. Like release.yml it only publishes a commit whose
# ci.yml run is green. A manual run (workflow_dispatch) builds everything and publishes nothing.
name: release-go
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read # the green-CI gate reads ci.yml runs
    steps:
      - name: Free runner disk space (preinstalled SDKs we never use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a green CI run for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json conclusion -q '.[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "no successful ci.yml run for $GITHUB_SHA; release only commits whose CI is green" >&2
            exit 1
          fi
      - name: Version from the tag
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && version=dev
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build every artifact (Linux, AppImage, Windows, macOS universal) in Docker
        run: make dist-all VERSION=${{ steps.version.outputs.version }}
      - name: Checksums
        working-directory: dist
        run: |
          rm -f *.new
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: goxterm-dist
          path: dist/*
          if-no-files-found: error
      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag $prerelease \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Unsigned builds. macOS: unzip, then xattr -dr com.apple.quarantine \"goXterm.app\"."
