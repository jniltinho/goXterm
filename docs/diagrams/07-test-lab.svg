Width="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-start-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="a-start-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="a-start-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker><marker id="a-start-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker><marker id="a-start-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect x="1" y="1" width="1398" height="1118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<path d="M36 101 H1364" stroke="#e2e8f0"/>
<rect x="28" y="120" width="1000" height="650" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="46" y="150" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">lab/compose.yaml  (default network)</text>
<rect x="1048" y="120" width="324" height="650" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1066" y="150" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">internal network</text>
<path d="M1004,234 L1066,234" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<rect x="28" y="800" width="1344" height="270" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
<rect x="42" y="814" width="126" height="36" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="105.0" y="838" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Run</text>
<path d="M744,935 L764,935" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<path d="M464,818 L464,770" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<text x="36" y="49" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">Docker protocol test lab</text>
<text x="36" y="79" font-size="14" fill="#475569" text-anchor="start">lab/compose.yaml: every port on 127.0.0.1, fictional credentials; make lab-test must pass exactly lab/expected-tests.txt</text>
<rect x="46" y="170" width="470" height="128" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text x="64" y="199" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">sshd</text>
<text x="64" y="228" font-size="14" fill="#0f172a" text-anchor="start">127.0.0.1:2222 → 22</text>
<rect x="534" y="170" width="470" height="128" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="552" y="199" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">bastion</text>
<text x="552" y="228" font-size="14" fill="#0f172a" text-anchor="start">127.0.0.1:2223 → 22; also on internal</text>
<rect x="46" y="316" width="470" height="128" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="64" y="345" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">ftp</text>
<text x="64" y="374" font-size="14" fill="#0f172a" text-anchor="start">2121 → 21; passive 30000-30009; FTP + explicit FTPS</text>
<rect x="534" y="316" width="470" height="128" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="552" y="345" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">ftps-implicit</text>
<text x="552" y="374" font-size="14" fill="#0f172a" text-anchor="start">2990 → 990; passive 30010-30019</text>
<rect x="46" y="462" width="470" height="128" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="64" y="491" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">rdp</text>
<text x="64" y="520" font-size="14" fill="#0f172a" text-anchor="start">13389 → 3389; xrdp + xorgxrdp</text>
<rect x="534" y="462" width="470" height="128" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="552" y="491" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">vnc</text>
<text x="552" y="520" font-size="14" fill="#0f172a" text-anchor="start">5901 → 5900; TigerVNC, VncAuth</text>
<rect x="46" y="608" width="470" height="128" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="64" y="637" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">telnetd</text>
<text x="64" y="666" font-size="14" fill="#0f172a" text-anchor="start">2323 → 23; inetutils telnetd</text>
<rect x="534" y="608" width="470" height="128" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="552" y="637" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">echo</text>
<text x="552" y="666" font-size="14" fill="#0f172a" text-anchor="start">2007 → 7; raw TCP echo</text>
<rect x="1066" y="170" width="288" height="128" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="1084" y="199" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700" font-family="DejaVu Sans Mono, monospace">internal</text>
<text x="1084" y="228" font-size="13" fill="#0f172a" text-anchor="start">Same SSH image, no host port;</text>
<text x="1084" y="249" font-size="13" fill="#0f172a" text-anchor="start">reachable as internal:22 through</text>
<text x="1084" y="270" font-size="13" fill="#0f172a" text-anchor="start">bastion</text>
<rect x="1066" y="330" width="288" height="420" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="1084" y="359" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Credentials (fictional)</text>
<text x="1084" y="388" font-size="13" fill="#0f172a" text-anchor="start">alice / lab-alice-pass</text>
<text x="1084" y="409" font-size="13" fill="#0f172a" text-anchor="start">bob: key lab/.generated/bob_ed25519</text>
<text x="1084" y="430" font-size="13" fill="#0f172a" text-anchor="start">carol: keyboard-interactive</text>
<text x="1084" y="451" font-size="13" fill="#0f172a" text-anchor="start">dave: MaxSessions 1</text>
<text x="1084" y="472" font-size="13" fill="#0f172a" text-anchor="start">sftponly: chroot SFTP</text>
<text x="1084" y="493" font-size="13" fill="#0f172a" text-anchor="start">VNC password lab-vnc1</text>
<rect x="184" y="818" width="560" height="234" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="847" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">make lab-test</text>
<text x="202" y="876" font-size="13" fill="#0f172a" text-anchor="start">lab/lab.sh up first. go test -count=1 -v -run '^TestLab' ./internal/... on</text>
<text x="202" y="897" font-size="13" fill="#0f172a" text-anchor="start">the host network with RXT_SSH_LAB=1, RXT_DEMO_SSH, RXT_SSH_KEY_TEST and</text>
<text x="202" y="918" font-size="13" fill="#0f172a" text-anchor="start">bob's key; log in .cache/lab-test.log. CI: the lab job of ci.yml.</text>
<rect x="764" y="818" width="582" height="234" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="782" y="847" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">lab/expected-tests.txt</text>
<text x="782" y="876" font-size="13" fill="#0f172a" text-anchor="start">TestLabDynamicSocks, TestLabEcho, TestLabFTPSExplicit, TestLabFTPSImplicit,</text>
<text x="782" y="897" font-size="13" fill="#0f172a" text-anchor="start">TestLabKeyAuth, TestLabLocalForward, TestLabRDP, TestLabRemoteForward,</text>
<text x="782" y="918" font-size="13" fill="#0f172a" text-anchor="start">TestLabSFTP, TestLabVNC. The run fails unless the passing tests equal this</text>
<text x="782" y="939" font-size="13" fill="#0f172a" text-anchor="start">list.</text>
<text x="36" y="1100" font-size="13" fill="#475569" text-anchor="start">Never point tests at real servers; lab/.generated/ (generated keys) is git-ignored and recreated by lab/lab.sh up</text>
</svg>
