<text x="105.0" y="158" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Clients</text>
<rect x="28" y="352" width="1344" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
<rect x="42" y="366" width="126" height="36" rx="8" fill="#16a34a" stroke="#16a34a" stroke-width="0"/>
