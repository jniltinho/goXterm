<text x="36" y="49" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">Build, release and CI</text>
<text x="36" y="79" font-size="14" fill="#475569" text-anchor="start">Everything builds in Docker through make; release-go.yml publishes only commits whose ci.yml run is green</text>
<rect x="184" y="138" width="480" height="164" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="167" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">rustxterm-go-linux</text>
<text x="202" y="196" font-size="14" fill="#0f172a" text-anchor="start">build/linux.Dockerfile (make image): Ubuntu 24.04, Go 1.27,</text>
<text x="202" y="217" font-size="14" fill="#0f172a" text-anchor="start">GTK 4 + WebKitGTK 6.0 headers, appimagetool + runtime, zip.</text>
<rect x="684" y="138" width="300" height="164" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="702" y="167" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">node:24</text>
<text x="702" y="196" font-size="14" fill="#0f172a" text-anchor="start">frontend: npm ci, vp build --mode</text>
<text x="702" y="217" font-size="14" fill="#0f172a" text-anchor="start">desktop, vp check.</text>
<rect x="1004" y="138" width="342" height="164" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="1022" y="167" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">rustxterm-go-linux-bench</text>
<text x="1022" y="196" font-size="14" fill="#0f172a" text-anchor="start">build/bench/Dockerfile: Xvfb harness for</text>
<text x="1022" y="217" font-size="14" fill="#0f172a" text-anchor="start">make bench.</text>
<rect x="184" y="370" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="399" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">check · test · layers</text>
<text x="202" y="428" font-size="13" fill="#0f172a" text-anchor="start">gofmt + go vet, unit tests,</text>
<text x="202" y="449" font-size="13" fill="#0f172a" text-anchor="start">archtest</text>
<rect x="478" y="370" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="496" y="399" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">guard</text>
<text x="496" y="428" font-size="13" fill="#0f172a" text-anchor="start">go run ./build/guard [--ci]</text>
<text x="496" y="449" font-size="13" fill="#0f172a" text-anchor="start">[--artifact]</text>
<rect x="773" y="370" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="791" y="399" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">frontend</text>
<text x="791" y="428" font-size="13" fill="#0f172a" text-anchor="start">icons + fonts, vp build →</text>
<text x="791" y="449" font-size="13" fill="#0f172a" text-anchor="start">internal/gui/dist</text>
<rect x="1068" y="370" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="1086" y="399" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">build</text>
<text x="1086" y="428" font-size="13" fill="#0f172a" text-anchor="start">Linux amd64, CGO (GTK 4 / WebKitGTK</text>
<text x="1086" y="449" font-size="13" fill="#0f172a" text-anchor="start">6.0)</text>
<rect x="184" y="524" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="553" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">appimage</text>
<text x="202" y="582" font-size="13" fill="#0f172a" text-anchor="start">AppDir + appimagetool</text>
<rect x="478" y="524" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="496" y="553" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">windows</text>
<text x="496" y="582" font-size="13" fill="#0f172a" text-anchor="start">CGO-free, WebView2, -H windowsgui</text>
<rect x="773" y="524" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="791" y="553" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">macos</text>
<text x="791" y="582" font-size="13" fill="#0f172a" text-anchor="start">purego amd64 + arm64; build/macapp</text>
<text x="791" y="603" font-size="13" fill="#0f172a" text-anchor="start">→ universal .app zip</text>
<rect x="1068" y="524" width="278" height="136" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="1086" y="553" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">lab-test · prints · bench</text>
<text x="1086" y="582" font-size="13" fill="#0f172a" text-anchor="start">lab tests, screenshot sweep,</text>
<text x="1086" y="603" font-size="13" fill="#0f172a" text-anchor="start">benchmark</text>
<rect x="184" y="732" width="377" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="761" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">…-linux-amd64</text>
<text x="202" y="790" font-size="13" fill="#0f172a" text-anchor="start">GTK 4 + WebKitGTK 6.0</text>
<rect x="577" y="732" width="377" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="595" y="761" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">…-x86_64.AppImage</text>
<text x="595" y="790" font-size="13" fill="#0f172a" text-anchor="start">system GTK / WebKitGTK</text>
<rect x="969" y="732" width="377" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="987" y="761" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">…-windows-amd64.exe</text>
<text x="987" y="790" font-size="13" fill="#0f172a" text-anchor="start">WebView2</text>
<rect x="184" y="838" width="377" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="867" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">…-darwin-amd64 / -arm64</text>
<text x="202" y="896" font-size="13" fill="#0f172a" text-anchor="start">per-architecture binaries</text>
<rect x="577" y="838" width="377" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="595" y="867" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">…_macos_universal.zip</text>
<text x="595" y="896" font-size="13" fill="#0f172a" text-anchor="start">goXterm.app, unsigned</text>
<rect x="969" y="838" width="377" height="88" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="987" y="867" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">SHA256SUMS</text>
<text x="987" y="896" font-size="13" fill="#0f172a" text-anchor="start">written by release-go.yml</text>
<text x="1346" y="1008" font-size="14" fill="#475569" text-anchor="end">push to main, pull requests; never publishes</text>
<rect x="184" y="1022" width="380" height="166" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="1051" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">checks</text>
<text x="202" y="1080" font-size="13" fill="#0f172a" text-anchor="start">make check test layers; make guard</text>
<text x="202" y="1101" font-size="13" fill="#0f172a" text-anchor="start">GUARD_ARGS=--ci (full history); frontend vp check</text>
<text x="202" y="1122" font-size="13" fill="#0f172a" text-anchor="start">--no-fmt</text>
<rect x="584" y="1022" width="380" height="166" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="602" y="1051" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">lab</text>
<text x="602" y="1080" font-size="13" fill="#0f172a" text-anchor="start">lab/lab.sh up; make embed-stub lab-test; lab logs</text>
<text x="602" y="1101" font-size="13" fill="#0f172a" text-anchor="start">on failure; lab/lab.sh down</text>
<rect x="984" y="1022" width="362" height="166" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="1002" y="1051" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">build</text>
<text x="1002" y="1080" font-size="13" fill="#0f172a" text-anchor="start">make build windows macos: every release target</text>
<text x="1002" y="1101" font-size="13" fill="#0f172a" text-anchor="start">still builds</text>
<text x="1346" y="1270" font-size="14" fill="#475569" text-anchor="end">v*.*.* tags; workflow_dispatch builds and uploads an artifact only</text>
<rect x="184" y="1284" width="278" height="210" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="202" y="1313" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">1 · Green-CI gate</text>
<text x="202" y="1342" font-size="13" fill="#0f172a" text-anchor="start">gh run list --workflow ci.yml</text>
<text x="202" y="1363" font-size="13" fill="#0f172a" text-anchor="start">--commit SHA --status success; none</text>
<text x="202" y="1384" font-size="13" fill="#0f172a" text-anchor="start">→ fail</text>
<rect x="478" y="1284" width="278" height="210" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="496" y="1313" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">2 · Version</text>
<text x="496" y="1342" font-size="13" fill="#0f172a" text-anchor="start">from the tag (v0.9.0 → 0.9.0)</text>
<rect x="773" y="1284" width="278" height="210" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="791" y="1313" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">3 · make dist-all</text>
<text x="791" y="1342" font-size="13" fill="#0f172a" text-anchor="start">every artifact in Docker</text>
<rect x="1068" y="1284" width="278" height="210" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="1086" y="1313" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">4 · Publish</text>
<text x="1086" y="1342" font-size="13" fill="#0f172a" text-anchor="start">SHA256SUMS; gh release create</text>
<text x="1086" y="1363" font-size="13" fill="#0f172a" text-anchor="start">(prerelease when the tag has '-')</text>
<rect x="410.0" y="1196" width="284.0" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="552.0" y="1215" font-size="13" fill="#0f172a" text-anchor="middle">ci.yml success for the tagged commit</text>
<text x="36" y="1546" font-size="13" fill="#475569" text-anchor="start">Go versions continue the Rust numbering: v0.8.0 was the last Rust release, v0.9.0 the first Go release</text>
