<rect x="1" y="1" width="1598" height="2098" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<path d="M36 101 H1564" stroke="#e2e8f0"/>
<rect x="28" y="300" width="1544" height="800" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="46" y="330" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">connect and trust the host key</text>
<rect x="28" y="1120" width="1544" height="440" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="46" y="1150" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">authenticate</text>
<rect x="28" y="1580" width="1544" height="450" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="46" y="1610" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">one connection, several channels</text>
