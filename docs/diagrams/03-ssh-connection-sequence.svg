<text x="36" y="49" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">SSH connection sequence</text>
<text x="36" y="79" font-size="14" fill="#475569" text-anchor="start">Host-key trust before authentication; password prompt with Save password; SFTP and monitoring on the same connection</text>
<rect x="46" y="126" width="218" height="103" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="64" y="155" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">User / SPA</text>
<text x="64" y="184" font-size="14" fill="#0f172a" text-anchor="start">trust and password</text>
<text x="64" y="205" font-size="14" fill="#0f172a" text-anchor="start">dialogs</text>
<rect x="288" y="126" width="218" height="103" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="306" y="155" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">internal/gui</text>
<text x="306" y="184" font-size="14" fill="#0f172a" text-anchor="start">App service</text>
<rect x="530" y="126" width="218" height="103" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text x="548" y="155" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">sshconn</text>
<text x="548" y="184" font-size="14" fill="#0f172a" text-anchor="start">x/crypto/ssh</text>
<rect x="772" y="126" width="218" height="103" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="790" y="155" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Trust</text>
<text x="790" y="184" font-size="14" fill="#0f172a" text-anchor="start">known_hosts (read-only)</text>
<text x="790" y="205" font-size="14" fill="#0f172a" text-anchor="start">+ ssh_trust table</text>
<rect x="1014" y="126" width="218" height="103" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="1032" y="155" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Store</text>
<text x="1032" y="184" font-size="14" fill="#0f172a" text-anchor="start">rustxterm.db</text>
<rect x="1256" y="126" width="218" height="103" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="1274" y="155" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">SSH server</text>
<rect x="196.0" y="238" width="160.0" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="276.0" y="257" font-size="13" fill="#0f172a" text-anchor="middle">Connect(sessionID)</text>
<circle cx="49" cy="276" r="16" fill="#7c3aed"/>
<text x="49" y="281" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="659.3" y="352" width="201.4" height="30" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
<text x="760.0" y="371" font-size="13" fill="#0f172a" text-anchor="middle">session + saved password</text>
<circle cx="49" cy="390" r="16" fill="#d97706"/>
<text x="49" y="395" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<rect x="379.4" y="432" width="277.1" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="518.0" y="451" font-size="13" fill="#0f172a" text-anchor="middle">DialClient(config, HostKeyCallback)</text>
<circle cx="49" cy="470" r="16" fill="#2563eb"/>
<text x="49" y="475" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<rect x="922.0" y="512" width="160.0" height="30" rx="15" fill="#ffffff" stroke="#0891b2" stroke-width="1"/>
<text x="1002.0" y="531" font-size="13" fill="#0f172a" text-anchor="middle">TCP + key exchange</text>
<circle cx="49" cy="550" r="16" fill="#0891b2"/>
<text x="49" y="555" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<rect x="932.3" y="582" width="139.4" height="30" rx="15" fill="#ffffff" stroke="#e11d48" stroke-width="1"/>
<text x="1002.0" y="601" font-size="13" fill="#0f172a" text-anchor="middle">server host key</text>
<rect x="410.4" y="662" width="215.1" height="30" rx="15" fill="#ffffff" stroke="#0891b2" stroke-width="1"/>
<text x="518.0" y="681" font-size="13" fill="#0f172a" text-anchor="middle">HostKeyCallback(host, key)</text>
<circle cx="49" cy="700" r="16" fill="#0891b2"/>
<text x="49" y="705" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<rect x="517.6" y="742" width="242.7" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="639.0" y="761" font-size="13" fill="#0f172a" text-anchor="middle">match known_hosts or ssh_trust</text>
<circle cx="49" cy="780" r="16" fill="#16a34a"/>
<text x="49" y="785" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<rect x="790" y="810" width="760" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="808" y="839" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Host-key trust • before any authentication</text>
<text x="808" y="868" font-size="14" fill="#0f172a" text-anchor="start">Match → continue. No match (new or changed key) → trust dialog with the SHA-256 fingerprint; the</text>
<text x="808" y="889" font-size="14" fill="#0f172a" text-anchor="start">dial waits for the answer. Reject or no answer → the connection is refused.</text>
<rect x="158.1" y="952" width="235.8" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
<text x="276.0" y="971" font-size="13" fill="#0f172a" text-anchor="middle">ssh:trust event (fingerprint)</text>
<circle cx="49" cy="990" r="16" fill="#16a34a"/>
<text x="49" y="995" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<rect x="130.5" y="1012" width="290.9" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="276.0" y="1031" font-size="13" fill="#0f172a" text-anchor="middle">SshTrustRespond: once / save / reject</text>
<circle cx="49" cy="1050" r="16" fill="#7c3aed"/>
<text x="49" y="1055" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<rect x="673.1" y="1052" width="173.8" height="30" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
<text x="760.0" y="1071" font-size="13" fill="#0f172a" text-anchor="middle">save → ssh_trust row</text>
<rect x="798.0" y="1162" width="408.1" height="30" rx="15" fill="#ffffff" stroke="#ea580c" stroke-width="1"/>
<text x="1002.0" y="1181" font-size="13" fill="#0f172a" text-anchor="middle">key file → ssh-agent → password / keyboard-interactive</text>
<circle cx="49" cy="1200" r="16" fill="#ea580c"/>
<text x="49" y="1205" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">9</text>
<rect x="790" y="1230" width="760" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
<text x="808" y="1259" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">No saved password</text>
<text x="808" y="1288" font-size="14" fill="#0f172a" text-anchor="start">askPassword emits ssh:password; the SPA asks with Save password and answers through</text>
<text x="808" y="1309" font-size="14" fill="#0f172a" text-anchor="start">SshPasswordRespond. Key passphrases are asked the same way.</text>
<rect x="196.0" y="1342" width="160.0" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="276.0" y="1361" font-size="13" fill="#0f172a" text-anchor="middle">ssh:password event</text>
<circle cx="49" cy="1380" r="16" fill="#7c3aed"/>
<text x="49" y="1385" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
<rect x="168.4" y="1402" width="215.1" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
<text x="276.0" y="1421" font-size="13" fill="#0f172a" text-anchor="middle">password (+ Save password)</text>
<circle cx="49" cy="1440" r="16" fill="#7c3aed"/>
<text x="49" y="1445" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">11</text>
<rect x="901.3" y="1442" width="201.4" height="30" rx="15" fill="#ffffff" stroke="#e11d48" stroke-width="1"/>
<text x="1002.0" y="1461" font-size="13" fill="#0f172a" text-anchor="middle">authentication succeeded</text>
<rect x="649.0" y="1502" width="222.0" height="30" rx="15" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
<text x="760.0" y="1521" font-size="13" fill="#0f172a" text-anchor="middle">store the password only now</text>
<circle cx="49" cy="1540" r="16" fill="#d97706"/>
<text x="49" y="1545" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">12</text>
<rect x="835.9" y="1622" width="332.3" height="30" rx="15" fill="#ffffff" stroke="#0891b2" stroke-width="1"/>
<text x="1002.0" y="1641" font-size="13" fill="#0f172a" text-anchor="middle">session channel: PTY xterm-256color + shell</text>
<circle cx="49" cy="1660" r="16" fill="#0891b2"/>
<text x="49" y="1665" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">13</text>
<rect x="147.8" y="1687" width="256.5" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text x="276.0" y="1706" font-size="13" fill="#0f172a" text-anchor="middle">term:out:&lt;tab&gt; (banner + output)</text>
<circle cx="49" cy="1725" r="16" fill="#2563eb"/>
<text x="49" y="1730" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">14</text>
<rect x="735.5" y="1752" width="290.9" height="30" rx="15" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="881.0" y="1771" font-size="13" fill="#0f172a" text-anchor="middle">SFTP subsystem channel → SFTP browser</text>
<circle cx="49" cy="1790" r="16" fill="#0d9488"/>
<text x="49" y="1795" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">15</text>
<rect x="718.3" y="1817" width="325.4" height="30" rx="15" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text x="881.0" y="1836" font-size="13" fill="#0f172a" text-anchor="middle">exec: shell cwd for Follow terminal folder</text>
<circle cx="49" cy="1855" r="16" fill="#0d9488"/>
<text x="49" y="1860" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">16</text>
<rect x="749.3" y="1882" width="263.4" height="30" rx="15" fill="#ffffff" stroke="#db2777" stroke-width="1"/>
<text x="881.0" y="1901" font-size="13" fill="#0f172a" text-anchor="middle">exec every 1–30 s → monitor:&lt;tab&gt;</text>
<circle cx="49" cy="1920" r="16" fill="#db2777"/>
<text x="49" y="1925" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">17</text>
<rect x="46" y="1950" width="900" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="64" y="1979" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">No second login: SFTP, folder following and monitoring reuse the connection</text>
<text x="36" y="2066" font-size="13" fill="#475569" text-anchor="start">Solid arrows: calls / channel operations</text>
<text x="800" y="2066" font-size="13" fill="#475569" text-anchor="start">Dashed arrows: server responses / events to the SPA</text>
</svg>
