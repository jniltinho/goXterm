<text x="202" y="747" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Agent control</text>
<text x="202" y="776" font-size="13" fill="#0f172a" text-anchor="start">live operations, policy</text>
<text x="202" y="797" font-size="13" fill="#0f172a" text-anchor="start">checks, approvals; macOS</text>
<text x="202" y="818" font-size="13" fill="#0f172a" text-anchor="start">and Windows transports</text>
<text x="202" y="839" font-size="13" fill="#0f172a" text-anchor="start">(3.3)</text>
<rect x="415" y="718" width="217" height="234" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
<text x="433" y="747" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Web trust boundary</text>
<text x="433" y="776" font-size="13" fill="#0f172a" text-anchor="start">loopback-only backend,</text>
<text x="433" y="797" font-size="13" fill="#0f172a" text-anchor="start">origin check, per-launch</text>
<text x="433" y="818" font-size="13" fill="#0f172a" text-anchor="start">token (3.4)</text>
<rect x="645" y="718" width="217" height="234" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="663" y="747" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Coexistence</text>
<text x="663" y="776" font-size="13" fill="#0f172a" text-anchor="start">file locking and</text>
<text x="663" y="797" font-size="13" fill="#0f172a" text-anchor="start">identities next to the</text>
<text x="663" y="818" font-size="13" fill="#0f172a" text-anchor="start">Rust app (2.3)</text>
<rect x="876" y="718" width="217" height="234" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="894" y="747" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">HiDPI and dialogs</text>
<text x="894" y="776" font-size="13" fill="#0f172a" text-anchor="start">DPR matrix (4.5); approval</text>
<text x="894" y="797" font-size="13" fill="#0f172a" text-anchor="start">dialogs, credential vault</text>
<text x="894" y="818" font-size="13" fill="#0f172a" text-anchor="start">(4.6)</text>
<rect x="1107" y="718" width="217" height="234" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
<text x="1125" y="747" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Platforms</text>
<text x="1125" y="776" font-size="13" fill="#0f172a" text-anchor="start">screenshot sweep on macOS</text>
<text x="1125" y="797" font-size="13" fill="#0f172a" text-anchor="start">and Windows (13.1); Rust</text>
<text x="1125" y="818" font-size="13" fill="#0f172a" text-anchor="start">rollback cycle (13.6)</text>
<rect x="1337" y="718" width="217" height="234" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="1355" y="747" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">New sessions</text>
<text x="1355" y="776" font-size="13" fill="#0f172a" text-anchor="start">XDMCP and rsh / rlogin</text>
<text x="1355" y="797" font-size="13" fill="#0f172a" text-anchor="start">(planned OpenSpec changes)</text>
