<text x="36" y="49" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">Roadmap</text>
<text x="36" y="79" font-size="14" fill="#475569" text-anchor="start">From the Rust/egui app to the Go + Wails app, and what comes next</text>
<rect x="250" y="138" width="424" height="184" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="268" y="167" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">v0.1.0</text>
<text x="268" y="196" font-size="14" fill="#0f172a" text-anchor="start">SSH, SFTP, FTP/FTPS, RDP, VNC, encrypted store,</text>
<text x="268" y="217" font-size="14" fill="#0f172a" text-anchor="start">agent control, distribution</text>
<rect x="694" y="138" width="424" height="184" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="712" y="167" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">v0.2 – v0.8</text>
<text x="712" y="196" font-size="14" fill="#0f172a" text-anchor="start">UI refinement, Telnet, Serial, local shell, Windows</text>
<text x="712" y="217" font-size="14" fill="#0f172a" text-anchor="start">and macOS ports, WSL, RDP Standard Security,</text>
<text x="712" y="238" font-size="14" fill="#0f172a" text-anchor="start">diagnostics</text>
<rect x="1138" y="138" width="424" height="184" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
<text x="1156" y="167" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Archived</text>
<text x="1156" y="196" font-size="14" fill="#0f172a" text-anchor="start">read-only in archive/rust/; v0.8.0 is the last Rust</text>
<text x="1156" y="217" font-size="14" fill="#0f172a" text-anchor="start">release</text>
<rect x="250" y="400" width="245" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="268" y="429" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">M1 – M3</text>
<text x="268" y="458" font-size="13" fill="#0f172a" text-anchor="start">scaffold, pure-Go store, SSH +</text>
<text x="268" y="479" font-size="13" fill="#0f172a" text-anchor="start">xterm.js, SFTP and FTP/FTPS</text>
<rect x="515" y="400" width="245" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="533" y="429" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">M4 – M8</text>
<text x="533" y="458" font-size="13" fill="#0f172a" text-anchor="start">VNC, pure-Go RDP, Serial,</text>
<text x="533" y="479" font-size="13" fill="#0f172a" text-anchor="start">Telnet, local shell,</text>
<text x="533" y="500" font-size="13" fill="#0f172a" text-anchor="start">monitoring, tunnels</text>
<rect x="780" y="400" width="245" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="798" y="429" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">M9 – M11</text>
<text x="798" y="458" font-size="13" fill="#0f172a" text-anchor="start">CLI store reads, control</text>
<text x="798" y="479" font-size="13" fill="#0f172a" text-anchor="start">transport, stdio MCP server</text>
<rect x="1046" y="400" width="245" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="1064" y="429" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">M12 – M25</text>
<text x="1064" y="458" font-size="13" fill="#0f172a" text-anchor="start">GUI parity, skins, MultiExec,</text>
<text x="1064" y="479" font-size="13" fill="#0f172a" text-anchor="start">import, Windows, macOS</text>
<text x="1064" y="500" font-size="13" fill="#0f172a" text-anchor="start">universal, benchmark</text>
<rect x="1311" y="400" width="245" height="250" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="1329" y="429" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Parity gate</text>
<text x="1329" y="458" font-size="13" fill="#0f172a" text-anchor="start">13.4 signed off 2026-11-07;</text>
<text x="1329" y="479" font-size="13" fill="#0f172a" text-anchor="start">13.5: releases switch to Go</text>
<text x="1329" y="500" font-size="13" fill="#0f172a" text-anchor="start">(v0.9.0), Rust archived</text>
