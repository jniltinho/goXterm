<text x="958" y="959" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Framebuffers</text>
<text x="958" y="988" font-size="13" fill="#0f172a" text-anchor="start">decoded in Go; only changed rectangles cross as PNG; a</text>
<text x="958" y="1009" font-size="13" fill="#0f172a" text-anchor="start">hidden VNC tab is paused</text>
<text x="36" y="1104" font-size="13" fill="#475569" text-anchor="start">Solid arrows: calls from the SPA toward the servers</text>
<text x="1364" y="1104" font-size="13" fill="#475569" text-anchor="end">Dashed arrows: data and events back to the SPA</text>
</svg>
