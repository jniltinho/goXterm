<text x="600" y="594" font-size="13" fill="#0f172a" text-anchor="start">saved passwords stay in Go</text>
<rect x="582" y="630" width="276" height="98" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="659" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Prompts</text>
