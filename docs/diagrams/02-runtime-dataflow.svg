<text x="36" y="49" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700">Runtime data flow</text>
<text x="36" y="79" font-size="14" fill="#475569" text-anchor="start">Vue SPA in the system webview ↔ Wails bindings and events ↔ internal/gui service ↔ core packages ↔ servers</text>
