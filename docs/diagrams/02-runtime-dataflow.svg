<text x="600" y="315" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Remote desktops</text>
<text x="600" y="344" font-size="13" fill="#0f172a" text-anchor="start">RdpConnect, RdpKey, RdpMouse,</text>
<text x="600" y="365" font-size="13" fill="#0f172a" text-anchor="start">VncConnect, VncKey, VncPointer</text>
