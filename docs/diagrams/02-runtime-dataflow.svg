<text x="58" y="516" font-size="13" fill="#0f172a" text-anchor="start">SFTP browser and dual-pane files</text>
<rect x="40" y="601" width="276" height="127" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="58" y="630" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Bars and dialogs</text>
<text x="58" y="659" font-size="13" fill="#0f172a" text-anchor="start">monitoring bar, trust and password</text>
<text x="58" y="680" font-size="13" fill="#0f172a" text-anchor="start">prompts, editor, settings</text>
<rect x="361" y="172" width="176" height="270" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
<text x="379" y="201" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Bindings</text>
<text x="379" y="230" font-size="13" fill="#0f172a" text-anchor="start">Call.ByName(method,</text>
<text x="379" y="251" font-size="13" fill="#0f172a" text-anchor="start">args) → Promise</text>
<rect x="361" y="458" width="176" height="270" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
<text x="379" y="487" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Events</text>
<text x="379" y="516" font-size="13" fill="#0f172a" text-anchor="start">app.Event.Emit(name,</text>
<text x="379" y="537" font-size="13" fill="#0f172a" text-anchor="start">data) → SPA</text>
<text x="379" y="558" font-size="13" fill="#0f172a" text-anchor="start">listeners</text>
