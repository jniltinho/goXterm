<text x="58" y="230" font-size="13" fill="#0f172a" text-anchor="start">xterm.js per terminal tab (SSH,</text>
<text x="58" y="251" font-size="13" fill="#0f172a" text-anchor="start">Telnet, Serial, local, WSL)</text>
<rect x="40" y="315" width="276" height="127" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="58" y="344" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">RdpView / VncView</text>
<text x="58" y="373" font-size="13" fill="#0f172a" text-anchor="start">&lt;canvas&gt; painted from PNG</text>
<text x="58" y="394" font-size="13" fill="#0f172a" text-anchor="start">rectangles</text>
<rect x="40" y="458" width="276" height="127" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
