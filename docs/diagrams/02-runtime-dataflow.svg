<text x="600" y="430" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Files and tunnels</text>
<text x="600" y="459" font-size="13" fill="#0f172a" text-anchor="start">remote list, download, upload;</text>
<text x="600" y="480" font-size="13" fill="#0f172a" text-anchor="start">tunnel start / stop</text>
