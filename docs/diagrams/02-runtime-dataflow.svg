<text x="46" y="959" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Events</text>
<text x="46" y="988" font-size="13" fill="#0f172a" text-anchor="start">term:out:&lt;tab&gt;, term:close:&lt;tab&gt;, rdp:frame:&lt;tab&gt;,</text>
<text x="46" y="1009" font-size="13" fill="#0f172a" text-anchor="start">vnc:frame:&lt;tab&gt;, monitor:&lt;tab&gt;, ssh:trust, ssh:password,</text>
<text x="46" y="1030" font-size="13" fill="#0f172a" text-anchor="start">tunnel:state</text>
<rect x="484" y="930" width="432" height="140" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="502" y="959" font-size="17" fill="#0f172a" text-anchor="start" font-weight="700">Ordered input</text>
<text x="502" y="988" font-size="13" fill="#0f172a" text-anchor="start">keys and mouse events go through an ordered queue, so</text>
<text x="502" y="1009" font-size="13" fill="#0f172a" text-anchor="start">input reaches the server in order</text>
